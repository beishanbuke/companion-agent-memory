[project]
name = "companion-agent-memory"
version = "0.2.0"
description = "A memory-aware companion agent prototype for undergraduate daily support"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pipecat-ai[webrtc,daily,silero,deepgram,openai,cartesia,runner]",
    "pipecat-ai-cli"
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
